[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apagent"
version = "0.1.0"
description = "AP Agent project"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "anthropic[aws]",
    "boto3",  # AnthropicBedrock signs requests via botocore; anthropic[aws] does not pull it
    "openai",
    "python-dotenv",
    "scipy",
    "pulp",
    "pdfplumber",
    "reportlab",
    "httpx",  # Telegram Bot API polling
    "fastapi",
    "python-multipart",  # FastAPI needs it for multipart file uploads
    "uvicorn",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    # so `pip install -e ".[dev]"` then `pytest` runs the FULL 268 — the
    # graph/mcp tests importorskip these and would otherwise skip 31.
    "langgraph",
    "mcp>=1.2,<2",
]
# Optional: the same pipeline expressed as a LangGraph state graph
# (src/apagent/graph.py). The core system does not import it.
langgraph = [
    "langgraph",
]
# Optional: expose the read-only tools as an MCP server, and let the agent
# call them over MCP with an in-process fallback (src/apagent/mcp_*.py).
mcp = [
    "mcp>=1.2,<2",
]
# Optional: run/deploy the agent on Amazon Bedrock AgentCore (deploy/).
deploy = [
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
